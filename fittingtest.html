<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 피팅 Pro</title>
<style>
:root{--bg:#f6f5f2;--fg:#1c1c1a;--card:#fff;--ac:#c2410c;--mu:#777;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#f0efeb;--card:#232321;--ac:#fb923c;--mu:#999;--bd:#3a3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0}.s{color:var(--mu);font-size:13px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
canvas{width:100%;border-radius:10px;touch-action:none;display:block;background:#222}
button{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:600;margin-top:10px}
button:disabled{opacity:.4}button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input[type=file]{display:none}
.up{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up label{aspect-ratio:3/4;border:2px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mu);background-size:cover;background-position:center}
.r{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}.r span{width:72px;color:var(--mu)}.r input[type=range]{flex:1}
#ed{display:none}
</style>
</head>
<body>
<h1>👗 가상 피팅 Pro</h1>
<p class="s">AI가 기기 안에서 얼굴·머리카락·피부를 자동 인식해 합성합니다. 외부 서버로 사진이 전송되지 않습니다.</p>
<div class="card">
 <div class="up">
  <label id="l1" for="f1">① 얼굴 사진<br>(정면 권장)</label>
  <label id="l2" for="f2">② 의상 사진<br>(모델 착용 사진)</label>
 </div>
 <input type="file" id="f1" accept="image/*"><input type="file" id="f2" accept="image/*">
 <button id="go" disabled>합성하기</button>
 <p class="s" id="st">AI 모델 불러오는 중… (처음 한 번만, 약 10MB)</p>
</div>
<div class="card" id="ed">
 <canvas id="cv"></canvas>
 <div class="r"><span>크기</span><input type="range" id="k" min="0.5" max="2" step="0.01" value="1"></div>
 <div class="r"><span>회전</span><input type="range" id="rt" min="-30" max="30" step="1" value="0"></div>
 <div class="r"><span>피부톤 맞춤</span><input type="range" id="co" min="0" max="1" step="0.05" value="0.8"></div>
 <div class="r"><span>경계 부드럽게</span><input type="range" id="fe" min="0" max="30" step="1" value="8"></div>
 <div class="r"><span>원본 머리 지우기</span><input type="checkbox" id="er" checked></div>
 <p class="s">드래그로 위치 이동, 두 손가락으로 크기 조절</p>
 <button id="sv">저장 / 공유</button>
</div>

<script type="module">
import {FilesetResolver,FaceLandmarker,ImageSegmenter} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
// 완전 오프라인/자체 호스팅: 아래 3개 경로를 같은 서버의 파일 경로로 바꾸세요.
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const FACE_MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const SEG_MODEL="https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";

const $=id=>document.getElementById(id), st=t=>$('st').textContent=t, tick=()=>new Promise(r=>setTimeout(r,30));
let lm,sg,Simg,Timg,S,T,headCv,baseCv,ts,ss,debounce;
const P={x:0,y:0};

try{
  const fs=await FilesetResolver.forVisionTasks(WASM);
  lm=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:FACE_MODEL,delegate:"CPU"},runningMode:"IMAGE",numFaces:1});
  sg=await ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:SEG_MODEL,delegate:"CPU"},runningMode:"IMAGE",outputCategoryMask:true,outputConfidenceMasks:false});
  st('준비 완료. 사진 두 장을 선택하세요.');ready();
}catch(e){st('모델 로드 실패: HTTPS로 호스팅했는지, 인터넷 연결을 확인하세요. ('+e.message+')')}

function ready(){$('go').disabled=!(Simg&&Timg&&lm)}
function pick(inp,lab,set){inp.onchange=()=>{const f=inp.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{set(i);lab.style.backgroundImage=`url(${u})`;lab.textContent='';ready()};i.src=u}}
pick($('f1'),$('l1'),i=>Simg=i);pick($('f2'),$('l2'),i=>Timg=i);

function toCanvas(img,max=1024){const w0=img.naturalWidth,h0=img.naturalHeight,r=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*r);c.height=Math.round(h0*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}

// 얼굴 랜드마크 + 부위 분할(0 배경,1 머리카락,2 몸피부,3 얼굴피부,4 옷,5 기타)
function analyze(cv){
  const o={cv,w:cv.width,h:cv.height};
  const L=lm.detect(cv).faceLandmarks[0];
  if(L){const a=L[33],b=L[263],ax=a.x*o.w,ay=a.y*o.h,bx=b.x*o.w,by=b.y*o.h;
    o.eye={x:(ax+bx)/2,y:(ay+by)/2};o.d=Math.hypot(bx-ax,by-ay);o.ang=Math.atan2(by-ay,bx-ax)}
  const m=sg.segment(cv).categoryMask,src=m.getAsUint8Array(),mw=m.width,mh=m.height;
  o.cat=new Uint8Array(o.w*o.h);
  for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++)o.cat[y*o.w+x]=src[((y*mh/o.h)|0)*mw+((x*mw/o.w)|0)];
  m.close();return o;
}

function blur(a,w,h,r){
  if(r<1)return a;const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1,cl=(v,m)=>v<0?0:v>m?m:v;
  for(let y=0;y<h;y++){const row=y*w;let s=0;for(let x=-r;x<=r;x++)s+=a[row+cl(x,w-1)];
    for(let x=0;x<w;x++){t[row+x]=s/n;s+=a[row+cl(x+r+1,w-1)]-a[row+cl(x-r,w-1)]}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[cl(y,h-1)*w+x];
    for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[cl(y+r+1,h-1)*w+x]-t[cl(y-r,h-1)*w+x]}}
  return o;
}

// sRGB <-> LAB
const fL=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116, lin=v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92};
function lab(R,G,B){const r=lin(R),g=lin(G),b=lin(B);
  const x=fL((.4124*r+.3576*g+.1805*b)/.95047),y=fL(.2126*r+.7152*g+.0722*b),z=fL((.0193*r+.1192*g+.9505*b)/1.08883);
  return[116*y-16,500*(x-y),200*(y-z)]}
function rgb(L,a,b){const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200,i=t=>t*t*t>0.008856?t*t*t:(t-16/116)/7.787;
  const X=i(fx)*.95047,Y=i(fy),Z=i(fz)*1.08883,g=v=>255*Math.min(1,Math.max(0,v>.0031308?1.055*v**(1/2.4)-.055:12.92*v));
  return[g(3.2406*X-1.5372*Y-.4986*Z),g(-.9689*X+1.8758*Y+.0415*Z),g(.0557*X-.204*Y+1.057*Z)]}
function stats(o,test){
  const d=o.cv.getContext('2d').getImageData(0,0,o.w,o.h).data;let n=0;const s=[0,0,0],q=[0,0,0];
  for(let i=0;i<o.cat.length;i+=3)if(test(o.cat[i])){const l=lab(d[4*i],d[4*i+1],d[4*i+2]);n++;for(let j=0;j<3;j++){s[j]+=l[j];q[j]+=l[j]*l[j]}}
  if(n<300)return null;const m=s.map(v=>v/n);return{m,s:q.map((v,j)=>Math.sqrt(Math.max(1,v/n-m[j]*m[j])))};
}

// 얼굴+머리카락 컷아웃 생성 (피부톤을 의상 모델의 피부 통계에 맞춤)
function buildHead(){
  const {w,h,cat}=S,id=S.cv.getContext('2d').getImageData(0,0,w,h),d=id.data,head=new Float32Array(w*h),skin=new Float32Array(w*h);
  for(let i=0;i<cat.length;i++){const c=cat[i];head[i]=(c==1||c==3)?1:0;skin[i]=c==3?1:0}
  const hb=blur(head,w,h,Math.round(+$('fe').value*w/1000+1));
  const k=+$('co').value,sw=blur(skin,w,h,Math.max(2,Math.round(w/80)));
  const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
  for(let i=0;i<cat.length;i++){
    const t=cl((hb[i]-.3)/.6,0,1);d[4*i+3]=Math.round(t*t*(3-2*t)*255);
    if(ts&&ss&&k>0&&sw[i]>.02){
      const l=lab(d[4*i],d[4*i+1],d[4*i+2]),o=[0,1,2].map(j=>(l[j]-ss.m[j])*cl(ts.s[j]/ss.s[j],.6,1.6)+ts.m[j]);
      const m=k*Math.min(1,sw[i]*1.5),c=rgb(l[0]+(o[0]-l[0])*m,l[1]+(o[1]-l[1])*m,l[2]+(o[2]-l[2])*m);
      d[4*i]=c[0];d[4*i+1]=c[1];d[4*i+2]=c[2];
    }
  }
  headCv=document.createElement('canvas');headCv.width=w;headCv.height=h;headCv.getContext('2d').putImageData(id,0,0);
}

// 의상 모델의 원래 머리를 배경색으로 덮어 제거
function eraseOld(){
  const {w,h,cat}=T,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(T.cv,0,0);
  const id=x.getImageData(0,0,w,h),d=id.data,m=new Float32Array(w*h);let n=0,r=0,g=0,b=0;
  for(let i=0;i<cat.length;i++){if(cat[i]==1||cat[i]==3)m[i]=1;else if(cat[i]==0&&i%3==0){n++;r+=d[4*i];g+=d[4*i+1];b+=d[4*i+2]}}
  if(n){r/=n;g/=n;b/=n;const mb=blur(m,w,h,Math.round(w/50));
    for(let i=0;i<cat.length;i++){const a=Math.min(1,mb[i]*4);if(a>0){d[4*i]+=(r-d[4*i])*a;d[4*i+1]+=(g-d[4*i+1])*a;d[4*i+2]+=(b-d[4*i+2])*a}}}
  x.putImageData(id,0,0);baseCv=c;
}

const cv=$('cv'),ctx=cv.getContext('2d');
function render(){
  ctx.drawImage($('er').checked?baseCv:T.cv,0,0);
  const s=T.d/S.d*(+$('k').value);
  ctx.save();ctx.translate(T.eye.x+P.x,T.eye.y+P.y);ctx.rotate(T.ang-S.ang+(+$('rt').value)*Math.PI/180);ctx.scale(s,s);
  ctx.drawImage(headCv,-S.eye.x,-S.eye.y);ctx.restore();
}

$('go').onclick=async()=>{
  $('go').disabled=true;
  try{
    st('얼굴 사진 분석 중…');await tick();S=analyze(toCanvas(Simg));
    if(!S.eye){st('얼굴 사진에서 얼굴을 찾지 못했어요. 정면 사진을 사용해 주세요.');return}
    st('의상 사진 분석 중…');await tick();T=analyze(toCanvas(Timg,1280));
    let note='';
    if(!T.eye){T.eye={x:T.w/2,y:T.h*.12};T.d=T.w*.12;T.ang=0;note=' (의상 사진에서 얼굴을 못 찾아 수동 조정이 필요해요)'}
    ss=stats(S,c=>c==3);ts=stats(T,c=>c==2||c==3);
    st('합성 중…');await tick();
    buildHead();eraseOld();P.x=P.y=0;$('k').value=1;$('rt').value=0;
    cv.width=T.w;cv.height=T.h;render();$('ed').style.display='block';st('완료!'+note);
    cv.scrollIntoView({behavior:'smooth'});
  }catch(e){st('오류: '+e.message)}
  $('go').disabled=false;
};

['co','fe'].forEach(i=>$(i).oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>{buildHead();render()},120)});
['k','rt','er'].forEach(i=>$(i).oninput=render);

// 드래그 + 핀치
const pt=new Map();let d0,k0;
const dist=()=>{const a=[...pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){d0=dist();k0=+$('k').value}};
cv.onpointermove=e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId),r=cv.width/cv.clientWidth;pt.set(e.pointerId,[e.clientX,e.clientY]);
  if(pt.size==1){P.x+=(e.clientX-o[0])*r;P.y+=(e.clientY-o[1])*r}else if(pt.size==2)$('k').value=Math.min(2,Math.max(.5,k0*dist()/d0));render()};
cv.onpointerup=cv.onpointercancel=e=>pt.delete(e.pointerId);

$('sv').onclick=()=>cv.toBlob(async b=>{
  const f=new File([b],'fitting.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fitting.jpg';a.click();
},'image/jpeg',.92);
</script>
</body>
</html>
